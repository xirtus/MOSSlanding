name: Build & Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────
  # Debian .deb — build on Ubuntu
  # ──────────────────────────────────────────
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Mosslanding v${VERSION} (.deb)"

      - name: Build .deb package
        run: |
          mkdir -p dist
          cd release/packaging
          # Only build the .deb portion
          bash -c '
            SCRIPT_DIR="$(pwd)"
            RELEASE_DIR="$(dirname "$SCRIPT_DIR")"
            VERSION="${{ steps.version.outputs.version }}"
            DIST_DIR="$RELEASE_DIR/dist"
            mkdir -p "$DIST_DIR"

            DEB_ROOT="$SCRIPT_DIR/debian"
            APP_ROOT="$DEB_ROOT/opt/mosslanding"
            USR_BIN="$DEB_ROOT/usr/bin"
            USR_SHARE_APPS="$DEB_ROOT/usr/share/applications"
            USR_SHARE_ICONS="$DEB_ROOT/usr/share/icons/hicolor"

            rm -rf "$APP_ROOT" "$USR_BIN" "$USR_SHARE_APPS" "$USR_SHARE_ICONS" 2>/dev/null || true
            mkdir -p "$APP_ROOT" "$USR_BIN" "$USR_SHARE_APPS"

            rsync -a --exclude="venv" --exclude="models" --exclude="__pycache__" --exclude="*.pyc" \
                  "$RELEASE_DIR/linux/" "$APP_ROOT/"
            mkdir -p "$APP_ROOT/models"

            cat > "$USR_BIN/mosslanding" << CLIEOF
          #!/usr/bin/env bash
          APP_DIR="/opt/mosslanding"
          if [ ! -d "\$APP_DIR/venv" ]; then
              echo "→ First run: setting up Python environment (1–2 min)..."
              /usr/bin/python3 -m venv "\$APP_DIR/venv"
              source "\$APP_DIR/venv/bin/activate"
              pip install --quiet --upgrade pip
              pip install --quiet "torch==2.9.1+cu128" "torchaudio==2.9.1+cu128" --index-url https://download.pytorch.org/whl/cu128
              pip install --quiet "transformers==5.0.0" "accelerate>=1.10.0" "safetensors>=0.6.0" "numpy>=2.0.0" "orjson>=3.11.0" "PyYAML>=6.0" "einops>=0.8.0" "tiktoken>=0.7.0" "tqdm>=4.67.0" "psutil>=5.9.0" "packaging>=24.0" "ninja>=1.11.0" "librosa>=0.11.0" "soundfile>=0.12.0" "scipy>=1.14.0" "pydantic>=2.0.0" "PySide6>=6.5.0"
              pip install --quiet flash-attn 2>/dev/null || true
              echo "✓ Setup complete. Launching..."
          fi
          cd "\$APP_DIR"
          source "\$APP_DIR/venv/bin/activate"
          exec python3 -m src.main "\$@"
          CLIEOF
            chmod 755 "$USR_BIN/mosslanding"

            cat > "$USR_SHARE_APPS/mosslanding.desktop" << DESKEOF
          [Desktop Entry]
          Type=Application
          Name=Mosslanding
          GenericName=MOSS-TTS Voice Synthesis
          Comment=AI-powered text-to-speech with voice cloning and voice design
          Icon=mosslanding
          Exec=/usr/bin/mosslanding %U
          Terminal=false
          Categories=Audio;Multimedia;ArtificialIntelligence;
          Keywords=TTS;voice;cloning;speech;synthesis;AI;MOSS;
          StartupWMClass=mosslanding
          StartupNotify=true
          DESKEOF

            for size in 32 48 64 128 256; do
              mkdir -p "$USR_SHARE_ICONS/${size}x${size}/apps"
              cp "$APP_ROOT/assets/icons/mosslanding_${size}.png" \
                 "$USR_SHARE_ICONS/${size}x${size}/apps/mosslanding.png" 2>/dev/null || true
            done
            mkdir -p "$USR_SHARE_ICONS/scalable/apps"
            cp "$APP_ROOT/assets/icons/mosslanding.svg" \
               "$USR_SHARE_ICONS/scalable/apps/mosslanding.svg" 2>/dev/null || true

            find "$DEB_ROOT" -type d -exec chmod 755 {} + 2>/dev/null || true
            find "$DEB_ROOT/usr" -type f -exec chmod 644 {} + 2>/dev/null || true
            find "$DEB_ROOT/opt" -type f -exec chmod 644 {} + 2>/dev/null || true
            chmod 755 "$DEB_ROOT/DEBIAN/postinst" "$DEB_ROOT/DEBIAN/prerm" 2>/dev/null || true
            find "$DEB_ROOT/opt" -name "*.sh" -exec chmod 755 {} + 2>/dev/null || true

            DEB_FILE="$DIST_DIR/mosslanding_${VERSION}_amd64.deb"
            dpkg-deb --build "$DEB_ROOT" "$DEB_FILE"
            ls -lh "$DEB_FILE"
          '

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosslanding-deb
          path: release/dist/*.deb

  # ──────────────────────────────────────────
  # Arch Linux .pkg.tar.zst — build in Arch container
  # ──────────────────────────────────────────
  build-arch:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git python python-pip python-virtualenv \
            python-pyqt6 qt6-base desktop-file-utils gtk-update-icon-cache \
            nvidia-utils rsync

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Arch package
        run: |
          mkdir -p dist
          SCRIPT_DIR="$(pwd)/release/packaging"
          RELEASE_DIR="$(pwd)/release"
          VERSION="${{ steps.version.outputs.version }}"
          DIST_DIR="${RELEASE_DIR}/dist"
          mkdir -p "$DIST_DIR"

          ARCH_BUILD_DIR="${SCRIPT_DIR}/arch/build"
          rm -rf "$ARCH_BUILD_DIR"
          mkdir -p "$ARCH_BUILD_DIR"

          cp "${SCRIPT_DIR}/arch/PKGBUILD" "$ARCH_BUILD_DIR/"
          cp "${SCRIPT_DIR}/arch/mosslanding.install" "$ARCH_BUILD_DIR/"

          cd "$ARCH_BUILD_DIR"

          sed -i "s|source=.*|source=('local')|" PKGBUILD
          sed -i "s|sha256sums=.*|sha256sums=('SKIP')|" PKGBUILD
          sed -i "s|cp -r \"\${srcdir}/MOSSlanding-\${pkgver}/release/linux/\"\*|cp -r \"${RELEASE_DIR}/linux/\"*|" PKGBUILD

          # makepkg refuses to run as root, create a build user
          useradd -m builduser
          chown -R builduser:builduser "$ARCH_BUILD_DIR"
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          sudo -u builduser bash -c "
            cd $ARCH_BUILD_DIR
            PKGEXT='.pkg.tar.zst' makepkg -s --noconfirm
          " 2>&1 || {
            echo "::warning::makepkg failed, trying without dependency resolution"
            sudo -u builduser bash -c "
              cd $ARCH_BUILD_DIR
              PKGEXT='.pkg.tar.zst' makepkg -d --noconfirm
            "
          }

          cp *.pkg.tar.zst "$DIST_DIR/" 2>/dev/null || echo "No package files found"
          ls -lh "$DIST_DIR/" 2>/dev/null || true

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosslanding-arch
          path: release/dist/*.pkg.tar.zst

  # ──────────────────────────────────────────
  # Create GitHub Release with all packages
  # ──────────────────────────────────────────
  release:
    needs: [build-deb, build-arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mosslanding-*
          path: release/dist/
          merge-multiple: true

      - name: List packages
        run: |
          echo "Packages built:"
          find release/dist -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mosslanding ${{ github.ref_name }}"
          body: |
            ## 🎙 Mosslanding ${{ github.ref_name }}

            AI-powered text-to-speech with voice cloning — runs 100% offline.

            ### 📦 Downloads

            | Package | System | Command |
            |---------|--------|---------|
            | `.deb` | Debian / Ubuntu | `sudo dpkg -i mosslanding_*.deb` |
            | `.pkg.tar.zst` | Arch Linux | `sudo pacman -U mosslanding-*.pkg.tar.zst` |

            ### 🚀 Quick Install

            **Debian / Ubuntu:**
            ```bash
            wget https://github.com/xirtus/MOSSlanding/releases/latest/download/mosslanding_latest_amd64.deb
            sudo dpkg -i mosslanding_latest_amd64.deb
            mosslanding
            ```

            **Arch Linux:**
            ```bash
            # Option 1: Download package directly
            wget https://github.com/xirtus/MOSSlanding/releases/latest/download/mosslanding-*.pkg.tar.zst
            sudo pacman -U mosslanding-*.pkg.tar.zst
            mosslanding

            # Option 2: Install from AUR (coming soon)
            # yay -S mosslanding
            ```

            ### Requirements
            - Linux (KDE/GNOME/Qt)
            - NVIDIA GPU 8GB+ VRAM (RTX 2070+)
            - Python 3.10+ (auto-installed on first run)
            - First launch downloads ~4-6 GB AI models

            ### What's New
            - TTS voice cloning (4 modes)
            - MOSS-VoiceGenerator support
            - 31 languages
            - Multi-GPU support
            - Native desktop integration

            Built from commit: `${{ github.sha }}`
          files: |
            release/dist/*.deb
            release/dist/*.pkg.tar.zst
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
